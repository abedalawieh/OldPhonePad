name: build

# Runs the same gate as a local build, so a green tick means the quality bar held
# on a clean checkout rather than only on the machine that wrote the code.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  # Normalises source paths recorded in the assemblies, which only makes sense on a
  # clean checkout. Set for the whole job so the value is identical at compile time
  # and at pack time - passing it to `pack --no-build` alone would do nothing, since
  # it affects compilation.
  ContinuousIntegrationBuild: true
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          # global.json pins the exact SDK, so the version is not repeated here.
          global-json-file: global.json

      - name: Restore
        run: dotnet restore OldPhonePad.sln

      - name: Verify formatting
        # Fails if anything in the repository is not formatted as .editorconfig requires.
        run: dotnet format OldPhonePad.sln --verify-no-changes --no-restore

      - name: Build
        # Warnings are errors, so an analyser finding fails the run.
        run: dotnet build OldPhonePad.sln -c Release --no-restore -warnaserror

      - name: Test
        run: dotnet test OldPhonePad.sln -c Release --no-build

      - name: Pack
        run: |
          dotnet pack src/OldPhonePad/OldPhonePad.csproj -c Release --no-build -o ./artifacts
          dotnet pack src/OldPhonePad.DependencyInjection/OldPhonePad.DependencyInjection.csproj -c Release --no-build -o ./artifacts

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: ./artifacts/*.*nupkg
          if-no-files-found: error
